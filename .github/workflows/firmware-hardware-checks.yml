name: Fly Radar Firmware and Hardware-Interface Checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  compile-esp8266:
    name: Compile for NodeMCU ESP8266
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Update Arduino package index
        run: arduino-cli core update-index

      - name: Install ESP8266 platform
        run: |
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core install esp8266:esp8266 --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json

      - name: Install sketch libraries
        run: |
          arduino-cli lib install "ArduinoJson@6"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit GC9A01A"

      - name: Verify expected hardware interface definitions
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^#define TFT_CS[[:space:]]+4$' ARDUnia-Fly-Radar.ino
          grep -Eq '^#define TFT_DC[[:space:]]+5$' ARDUnia-Fly-Radar.ino
          grep -Eq '^#define TFT_RST[[:space:]]+16$' ARDUnia-Fly-Radar.ino
          grep -Eq 'const int SCREEN_W = 240;' ARDUnia-Fly-Radar.ino
          grep -Eq 'const int SCREEN_H = 240;' ARDUnia-Fly-Radar.ino
          grep -Eq 'const double RADAR_RANGE_NM = 40\.0;' ARDUnia-Fly-Radar.ino
          grep -Eq 'const unsigned long UPDATE_INTERVAL = 15000UL;' ARDUnia-Fly-Radar.ino
          echo "Hardware-interface constants match the documented design."

      - name: Compile firmware
        run: arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 --warnings all ARDUnia-Fly-Radar.ino
